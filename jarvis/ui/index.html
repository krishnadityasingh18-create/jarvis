<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #0d1117; --panel: #151b23; --line: #262d36; --text: #e6edf3; --dim: #8b949e;
    --idle: #3b4654; --listening: #2f81f7; --thinking: #d29922; --speaking: #3fb950;
    --warn-bg: #3d2e00; --warn: #f2cc60;
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto auto auto 1fr auto auto;
         background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
  #orb { width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; flex: none;
         background: var(--idle); transition: background .2s, box-shadow .2s; }
  #orb.listening { background: var(--listening); box-shadow: 0 0 18px var(--listening); animation: pulse 1.2s infinite; }
  #orb.thinking  { background: var(--thinking);  box-shadow: 0 0 14px var(--thinking); }
  #orb.confirming { background: var(--listening); box-shadow: 0 0 18px var(--warn); animation: pulse 1.2s infinite; }
  #orb.speaking  { background: var(--speaking);  box-shadow: 0 0 18px var(--speaking); animation: pulse .8s infinite; }
  @keyframes pulse { 50% { transform: scale(1.08); } }
  #orb:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  h1 { margin: 0; font-size: 17px; letter-spacing: .12em; font-weight: 600; }
  #status { color: var(--dim); font-size: 13px; }
  #meter { margin-left: auto; color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
  #banners:empty { display: none; }
  .banner { background: var(--warn-bg); color: var(--warn); padding: 6px 20px; font-size: 13px;
            display: flex; justify-content: space-between; gap: 12px; }
  .banner button { background: none; border: none; color: var(--warn); cursor: pointer; font-size: 15px; }
  #actions { border-bottom: 1px solid var(--line); font-size: 13px; }
  #actions summary { padding: 6px 20px; color: var(--dim); cursor: pointer; }
  #actlist { list-style: none; margin: 0; padding: 0 20px 8px; max-height: 30vh; overflow-y: auto; }
  #actlist li { display: flex; gap: 10px; align-items: center; padding: 3px 0; }
  #actlist .t { color: var(--dim); font-variant-numeric: tabular-nums; }
  #actlist .tool { font-family: Consolas, monospace; }
  #actlist .args { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; }
  #actlist .agent { color: var(--thinking); }
  #actlist .done { color: var(--speaking); } #actlist .failed { color: #f85149; } #actlist .undone, #actlist .declined { color: var(--dim); }
  #actlist button, #confirm button { background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 10px; cursor: pointer; font: inherit; }
  #confirm { display: none; align-items: center; gap: 12px; padding: 10px 20px; background: var(--warn-bg); color: var(--warn); }
  #confirm.open { display: flex; }
  #confirm .q { flex: 1; } #confirm .left { font-variant-numeric: tabular-nums; }
  #confirm .yes { border-color: var(--speaking); }
  main { display: grid; grid-template-columns: minmax(260px, 2fr) 3fr; min-height: 0; }
  #transcript, #detail { overflow-y: auto; padding: 16px 20px; }
  #transcript { border-right: 1px solid var(--line); }
  .msg { margin: 0 0 10px; max-width: 95%; }
  .msg.user { color: var(--dim); }
  .msg.user::before { content: "You  "; font-size: 11px; letter-spacing: .08em; }
  .msg.assistant::before { content: "JARVIS  "; font-size: 11px; letter-spacing: .08em; color: var(--speaking); }
  .msg.cut::after { content: " …"; color: var(--dim); }
  #detail { background: var(--panel); }
  #detail:empty::before { content: "Detail appears here when there is more than fits in a spoken reply."; color: var(--dim); }
  #detail pre { background: var(--bg); padding: 10px; border-radius: 6px; overflow-x: auto; }
  #detail code { font-family: Consolas, monospace; font-size: 13px; }
  #detail table { border-collapse: collapse; } #detail td, #detail th { border: 1px solid var(--line); padding: 4px 8px; }
  #detail a { color: var(--listening); }
  footer { display: flex; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--line); }
  #text { flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line);
          border-radius: 6px; padding: 9px 12px; font: inherit; }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; font: inherit; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
                              #transcript { border-right: none; border-bottom: 1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <button id="orb" class="idle" title="Click to stop" aria-label="Status; click to stop the current reply"></button>
  <div><h1>JARVIS</h1><div id="status" aria-live="polite">Connecting…</div></div>
  <div id="meter"></div>
</header>
<div id="banners" role="status"></div>
<details id="actions"><summary>Actions</summary><ol id="actlist" aria-label="Action log"></ol></details>
<main>
  <section id="transcript" aria-label="Transcript"></section>
  <section id="detail" aria-label="Detail"></section>
</main>
<div id="confirm" role="alertdialog" aria-live="assertive">
  <span class="q"></span><span class="left"></span>
  <button class="yes">Confirm</button><button class="no">Cancel</button>
</div>
<footer>
  <input id="text" placeholder="Type to JARVIS, or say “Hey Jarvis”…" aria-label="Message" autocomplete="off">
  <select id="route" aria-label="Model route">
    <option value="fast">fast</option><option value="reasoning">reasoning</option><option value="local">local</option>
  </select>
</footer>
<script src="/ui/marked.min.js"></script>
<script src="/ui/purify.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const LABEL = { idle: "Idle", listening: "Listening…", thinking: "Thinking…", speaking: "Speaking",
                confirming: "Say yes or no…" };
const ICON = { done: "✓", failed: "✗", declined: "–", undone: "↶" };
let ws, screenText = "", current = null, confirmId = null, confirmTimer = null;

function setState(s) { $("orb").className = s; $("status").textContent = LABEL[s] || s; }
function renderDetail() { $("detail").innerHTML = DOMPurify.sanitize(marked.parse(screenText)); }
function line(cls, text) {
  const p = document.createElement("p"); p.className = "msg " + cls; p.textContent = text;
  $("transcript").append(p); $("transcript").scrollTop = 1e9; return p;
}
function banner(text) {
  const b = document.createElement("div"); b.className = "banner";
  b.innerHTML = "<span></span><button aria-label='Dismiss'>×</button>";
  b.firstChild.textContent = text; b.lastChild.onclick = () => b.remove();
  $("banners").append(b); setTimeout(() => b.remove(), 15000);
}

function actRow(a) {
  let li = document.getElementById("act" + a.id);
  if (!li) { li = document.createElement("li"); li.id = "act" + a.id; $("actlist").prepend(li); }
  li.replaceChildren();
  const span = (cls, text) => { const s = document.createElement("span"); s.className = cls; s.textContent = text; li.append(s); return s; };
  span("t", (a.ts || "").slice(11, 16));
  span(a.status, ICON[a.status] || a.status).title = a.status + ": " + (a.result || "");
  span("tool", a.tool);
  span("args", Object.values(a.args || {}).join(" "));
  if (a.agent) span("agent", "via " + a.agent);
  if (a.status === "done" && a.undo) {
    const b = document.createElement("button"); b.textContent = "Undo";
    b.onclick = () => send({ type: "undo", id: a.id }); li.append(b);
  }
}
function closeConfirm() { $("confirm").classList.remove("open"); clearInterval(confirmTimer); confirmId = null; }
function answer(ok) { if (confirmId) send({ type: "confirm_reply", id: confirmId, ok }); }

const on = {
  history(m) {
    $("transcript").replaceChildren();
    for (const h of m.messages) {
      const p = line(h.role, h.content || (h.screen ? "(on screen)" : "(interrupted)"));
      if (h.interrupted) p.classList.add("cut");
    }
    const last = m.messages.findLast(h => h.role === "assistant");
    screenText = last ? last.screen : ""; renderDetail();
    $("route").value = m.route;
  },
  usage(m) {
    const req = Object.entries(m.requests_today).map(([p, n]) => `${p} ${n}`).join(" · ") || "no requests";
    $("meter").textContent = `₹${m.spent_inr} / ₹${m.cap_inr} · ${req} today`;
  },
  state(m) { setState(m.state); },
  user_text(m) { line("user", m.text); current = null; screenText = ""; renderDetail(); },
  spoken_sentence(m) {
    if (!current) current = line("assistant", m.text);
    else current.textContent += " " + m.text;
  },
  screen_delta(m) { screenText += m.text; renderDetail(); },
  turn_end() { current = null; setState("idle"); },
  route(m) { $("status").textContent = `${LABEL.thinking} (${m.route})`; },
  banner(m) { banner(m.text); },
  actions(m) { $("actlist").replaceChildren(); [...m.actions].reverse().forEach(actRow); },
  action(m) { actRow(m); },
  agent(m) { $("status").textContent = `Consulting ${m.agent}…`; },
  confirm(m) {
    confirmId = m.id; let left = m.seconds;
    $("confirm").querySelector(".q").textContent = m.text;
    const tick = () => { $("confirm").querySelector(".left").textContent = left > 0 ? `${left}s` : ""; left--; };
    clearInterval(confirmTimer); tick(); confirmTimer = setInterval(tick, 1000);
    $("confirm").classList.add("open"); $("confirm").querySelector(".no").focus();  // safe default
  },
  confirm_done(m) { if (m.id === confirmId) closeConfirm(); },
};

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => setState("idle");
  ws.onmessage = e => { const m = JSON.parse(e.data); on[m.type]?.(m); };
  ws.onclose = () => { $("status").textContent = "Disconnected, retrying…"; setTimeout(connect, 2000); };
}
const send = m => ws?.readyState === 1 && ws.send(JSON.stringify(m));

$("text").addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.value.trim()) { send({ type: "text_input", text: e.target.value }); e.target.value = ""; }
});
$("orb").onclick = () => send({ type: "cancel" });
$("confirm").querySelector(".yes").onclick = () => answer(true);
$("confirm").querySelector(".no").onclick = () => answer(false);
$("route").onchange = e => send({ type: "set_route", route: e.target.value });
connect();
</script>
</body>
</html>
