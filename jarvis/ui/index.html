<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F5F5F7; --text: #1D1D1F; --text2: #6E6E73; --sep: rgba(0, 0, 0, .08);
    --glass: rgba(255, 255, 255, .62); --glass-strong: rgba(255, 255, 255, .8); --edge: rgba(255, 255, 255, .75);
    --fill: rgba(0, 0, 0, .05); --fill-hover: rgba(0, 0, 0, .08);
    --shadow: 0 12px 40px rgba(0, 0, 0, .10), 0 1px 3px rgba(0, 0, 0, .06);
    --danger: #E5484D; --ok: #30A46C; --warn: #C27C0E; --blue: #0A84FF;
    --acc: #3D6FD9;   /* core.js fades it to the state colour */
    --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    --display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
    --r-lg: 22px; --r-md: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000; --text: #F5F5F7; --text2: #98989D; --sep: rgba(255, 255, 255, .1);
      --glass: rgba(28, 28, 30, .55); --glass-strong: rgba(36, 36, 38, .78); --edge: rgba(255, 255, 255, .09);
      --fill: rgba(255, 255, 255, .07); --fill-hover: rgba(255, 255, 255, .12);
      --shadow: 0 12px 40px rgba(0, 0, 0, .55), 0 1px 3px rgba(0, 0, 0, .4);
      --danger: #FF6369; --ok: #3DD68C; --warn: #FFB224; --acc: #CFE3FF;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font: 0.9375rem/1.47 var(--font);
         -webkit-font-smoothing: antialiased; transition: background-color .4s, color .4s; }
  /* the state colour, faint, behind everything */
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
                 background: radial-gradient(60% 55% at 50% 42%, color-mix(in srgb, var(--acc) 9%, transparent), transparent 70%); }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* glass: one material; bigger surfaces read thicker */
  .glass { background: var(--glass); border: 1px solid var(--edge); box-shadow: var(--shadow);
           -webkit-backdrop-filter: blur(28px) saturate(180%); backdrop-filter: blur(28px) saturate(180%); }
  .glass.strong { background: var(--glass-strong); -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%); }

  /* feedback lives on the press, and it's instant */
  .btn, .icon-btn, .chip, .row, #core { transition: transform 100ms ease-out, background-color 150ms; }
  .btn:active, .icon-btn:active, .chip:active, .row:active { transform: scale(.97); }
  .icon-btn { width: 40px; height: 40px; border: 0; border-radius: 50%; background: transparent; cursor: pointer;
              display: inline-flex; align-items: center; justify-content: center; color: var(--text2); flex: none; }
  .icon-btn:hover { background: var(--fill-hover); color: var(--text); }
  .icon-btn.on { color: var(--danger); }

  /* ---- top bar */
  .bar { position: fixed; top: 14px; left: 50%; translate: -50% 0; z-index: 5; width: min(760px, calc(100% - 28px));
         height: 52px; padding: 0 8px 0 18px; border-radius: 26px; display: flex; align-items: center; gap: 10px; }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .who b { font: 600 1rem/1 var(--display); letter-spacing: -.01em; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--acc) 25%, transparent); flex: none; }
  #status { color: var(--text2); font-size: 0.875rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill { height: 32px; border: 0; border-radius: 16px; padding: 0 12px; background: var(--fill); cursor: pointer; font-size: 0.8125rem; font-weight: 500; }
  .pill:hover { background: var(--fill-hover); }

  /* ---- stage */
  .stage { position: fixed; inset: 80px 0 104px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #core { width: min(52vh, 72vw); aspect-ratio: 1; padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: 50%; flex: none; }
  #core:active { transform: scale(.985); }
  #core canvas { width: 100%; height: 100%; display: block; }
  .speech { width: min(680px, calc(100% - 40px)); text-align: center; min-height: 6.5em; }
  #asked { margin: 4px 0 6px; min-height: 1.47em; color: var(--text2); font-size: 0.9375rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #caption { margin: 0; font: 600 clamp(20px, 2.5vw, 30px)/1.18 var(--display); letter-spacing: -.02em;
             display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .chip { margin-top: 12px; height: 32px; padding: 0 14px; border: 0; border-radius: 16px; background: var(--fill); cursor: pointer;
          font-size: 0.8125rem; font-weight: 500; }
  .chip:hover { background: var(--fill-hover); }

  /* ---- input bar */
  .dock { position: fixed; left: 0; right: 0; bottom: 18px; z-index: 4; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 14px; }
  .input { width: min(680px, 100%); height: 56px; padding: 0 8px; border-radius: 28px; display: flex; align-items: center; gap: 4px; }
  .input input[type=text] { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; padding: 0 8px; font-size: 1rem; }
  .input input::placeholder { color: var(--text2); }
  /* the + menu: anchored to its button, grows up and out of it */
  .plus { position: relative; }
  .menu { position: absolute; bottom: calc(100% + 12px); right: -8px; z-index: 6; width: 15.5rem; padding: 6px;
          border-radius: var(--r-md); transform-origin: calc(100% - 28px) 100%; }
  .mi { width: 100%; height: 2.375rem; padding: 0 10px; border: 0; border-radius: 9px; background: transparent; cursor: pointer;
        display: flex; align-items: center; gap: 10px; text-align: left; font-size: .875rem; transition: background-color 100ms; }
  .mi:hover, .mi:focus-visible { background: var(--fill-hover); outline: none; }
  .mi .ic { width: 18px; height: 18px; color: var(--text2); }
  .mi span { flex: 1; }
  .sep { height: 1px; margin: 5px 8px; background: var(--sep); }
  .switch { position: relative; width: 30px; height: 18px; border-radius: 9px; background: var(--fill-hover); flex: none; transition: background-color 200ms; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff;
                   box-shadow: 0 1px 2px rgba(0, 0, 0, .3); transition: translate 200ms cubic-bezier(.3, .7, .4, 1); }
  .mi[aria-checked="true"] .switch { background: var(--ok); }
  .mi[aria-checked="true"] .switch::after { translate: 12px 0; }
  #files { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
  #files:empty { display: none; }
  #files li { display: inline-flex; align-items: center; gap: 2px; height: 32px; padding-left: 12px; border-radius: 16px; font-size: 0.8125rem; }
  #files span { max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #files .icon-btn { width: 32px; height: 32px; }

  /* ---- notifications */
  #toasts { position: fixed; top: 80px; right: 16px; z-index: 7; display: flex; flex-direction: column; gap: 10px; width: min(340px, calc(100% - 32px)); }
  .toast { display: flex; gap: 10px; align-items: flex-start; padding: 12px 8px 12px 14px; border-radius: var(--r-md); }
  .toast div { flex: 1; min-width: 0; font-size: 0.875rem; }
  .toast b { display: block; font-weight: 600; }
  .toast .icon-btn { width: 28px; height: 28px; }

  /* ---- side panel */
  .sheet { position: fixed; top: 80px; right: 14px; bottom: 18px; z-index: 6; width: min(420px, calc(100% - 28px));
           border-radius: var(--r-lg); display: flex; flex-direction: column; overflow: hidden; will-change: transform, opacity; }
  .sheet header { display: flex; align-items: center; gap: 6px; padding: 10px 10px 10px 12px; }
  .seg { flex: 1; display: flex; padding: 2px; border-radius: 10px; background: var(--fill); }
  .seg button { flex: 1; height: 28px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; font-size: 0.78125rem;
                font-weight: 500; letter-spacing: .01em; color: var(--text2); white-space: nowrap; transition: background-color 150ms, color 150ms; }
  .seg button[aria-selected="true"] { background: var(--glass-strong); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
  .panel { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 18px;
           mask-image: linear-gradient(to bottom, transparent 0, #000 12px, #000 calc(100% - 16px), transparent 100%); }
  .panel { scrollbar-width: thin; scrollbar-color: var(--fill-hover) transparent; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0 4px; }
  .panel-head h2 { margin: 0; }
  .panel-head .btn { display: inline-flex; align-items: center; gap: 6px; }
  .panel-head .btn .ic { width: 15px; height: 15px; }
  .panel h2 { margin: 10px 0 8px; font: 600 0.8125rem var(--font); color: var(--text2); }
  .empty { color: var(--text2); font-size: 0.875rem; margin-top: 12px; }
  /* the conversation, as bubbles */
  #transcript { display: flex; flex-direction: column; gap: 8px; padding-top: 8px; }
  .msg { margin: 0; max-width: 86%; padding: 8px 12px; border-radius: 18px; font-size: 0.875rem; line-height: 1.4; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--blue); color: #fff; border-bottom-right-radius: 6px; }
  .msg.assistant { align-self: flex-start; background: var(--fill); border-bottom-left-radius: 6px; }
  .msg.cut::after { content: " …"; opacity: .6; }
  .msg.note { align-self: center; max-width: 100%; background: none; color: var(--warn); font-size: 0.75rem; padding: 2px; }
  #detail { font-size: 0.875rem; }
  #detail h1, #detail h2, #detail h3 { font: 600 1rem/1.3 var(--display); margin: 14px 0 6px; color: var(--text); }
  #detail pre { background: var(--fill); padding: 10px; border-radius: 10px; overflow-x: auto; }
  #detail code { font-family: var(--mono); font-size: 0.78125rem; }
  #detail table { border-collapse: collapse; font-size: 0.8125rem; }
  #detail td, #detail th { border-bottom: 1px solid var(--sep); padding: 5px 8px; text-align: left; }
  #detail a { color: var(--blue); }
  #actlist { list-style: none; margin: 0; padding: 0; }
  #actlist li { display: grid; grid-template-columns: 18px 1fr auto auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--sep); font-size: 0.875rem; }
  #actlist .tool { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #actlist .tool em { font-style: normal; color: var(--text2); }
  #actlist .t { color: var(--text2); font-size: 0.75rem; font-variant-numeric: tabular-nums; }
  #actlist .done { color: var(--ok); } #actlist .failed { color: var(--danger); } #actlist .undone, #actlist .declined { color: var(--text2); }
  .btn { height: 30px; padding: 0 12px; border: 0; border-radius: 15px; background: var(--fill); cursor: pointer; font-size: 0.8125rem; font-weight: 500; }
  .btn:hover { background: var(--fill-hover); }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.primary:hover { background: #0077ED; }
  #chatlist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .row { width: 100%; padding: 10px 12px; border: 0; border-radius: 12px; background: transparent; text-align: left; cursor: pointer;
         display: flex; flex-direction: column; gap: 2px; }
  .row:hover { background: var(--fill); }
  .row.cur { background: var(--fill-hover); }
  .row .ti { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .me { font-size: 0.75rem; color: var(--text2); }
  .net { position: relative; width: min(320px, 100%); aspect-ratio: 1; margin: 22px auto 18px; }
  .net svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ln { stroke: var(--sep); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
  .ln.on { stroke: var(--acc); }
  .nd { position: absolute; width: 12%; aspect-ratio: 1; border-radius: 50%; background: var(--fill); border: 1px solid var(--sep);
        transition: background-color .3s, box-shadow .3s; }
  .nd.on { background: color-mix(in srgb, var(--acc) 35%, transparent); box-shadow: 0 0 18px color-mix(in srgb, var(--acc) 50%, transparent); }
  .nd.core { left: 40%; top: 40%; width: 20%; display: flex; align-items: center; justify-content: center; font-size: 0.8125rem; font-weight: 600; }
  .lb { position: absolute; left: 50%; translate: -50% 0; white-space: nowrap; font-size: 0.75rem; color: var(--text2); }
  .lb.up { bottom: calc(100% + 6px); } .lb.dn { top: calc(100% + 6px); }
  .nd.on .lb { color: var(--text); }
  #netcap { text-align: center; color: var(--text2); font-size: 0.875rem; }

  /* ---- confirmation: dim to focus */
  #scrim { position: fixed; inset: 0; z-index: 8; background: rgba(0, 0, 0, .28); }
  #confirm { position: fixed; left: 50%; top: 50%; translate: -50% -50%; z-index: 9; width: min(360px, calc(100% - 32px));
             padding: 22px 20px 16px; border-radius: var(--r-lg); text-align: center; }
  #confirm h2 { margin: 0 0 6px; font: 600 1.0625rem/1.3 var(--display); letter-spacing: -.01em; }
  #confirm p { margin: 0 0 18px; color: var(--text2); font-size: 0.875rem; }
  #confirm .row2 { display: flex; gap: 8px; }
  #confirm .btn { flex: 1; height: 40px; border-radius: 12px; font-size: 0.9375rem; }

  @media (max-width: 640px) {
    .sheet { left: 14px; width: auto; }
  }
  @media (prefers-reduced-transparency: reduce) {
    .glass, .glass.strong { -webkit-backdrop-filter: none; backdrop-filter: none; background: var(--bg); }
  }
  @media (prefers-contrast: more) {
    .glass { background: var(--bg); border-color: var(--text2); }
    #status, #asked, .row .me { color: var(--text); }
  }
</style>
</head>
<body>
<header class="bar glass">
  <div class="who"><span class="dot" aria-hidden="true"></span><b>Jarvis</b><span id="status" aria-live="polite">Connecting…</span></div>
  <label class="sr" for="route">Model</label>
  <select id="route" class="pill">
    <option value="fast">Fast</option><option value="reasoning">Reasoning</option><option value="local">Local</option>
  </select>
</header>

<div id="toasts" role="status"></div>

<main class="stage">
  <button id="core" type="button" aria-label="Stop the current reply" title="Stop"><canvas id="sphere"></canvas></button>
  <section class="speech" aria-live="polite">
    <p id="asked"></p>
    <p id="caption"></p>
    <button class="chip" id="more" type="button" hidden>Show details</button>
  </section>
</main>

<footer class="dock">
  <ul id="files" aria-label="Attached files"></ul>
  <div class="input glass strong">
    <button class="icon-btn" id="mic" type="button" aria-pressed="false" aria-label="Mute microphone" title="Mute microphone">
      <svg class="ic on" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
      <svg class="ic off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M4 4l16 16"/><path d="M9 9v3a3 3 0 0 0 5.1 2.1"/><path d="M15 11V6a3 3 0 0 0-5.7-1.3"/><path d="M5 11a7 7 0 0 0 11.2 5.6"/><path d="M19 11a7 7 0 0 1-.6 2.8"/><path d="M12 18v3"/></svg>
    </button>
    <label class="sr" for="text">Message</label>
    <input id="text" type="text" autocomplete="off" placeholder="Ask Jarvis, or say “Hey Jarvis”">
    <div class="plus">
      <button class="icon-btn" id="plus" type="button" aria-label="Add files and more" title="Add files and more"
              aria-haspopup="menu" aria-expanded="false" aria-controls="plusmenu">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <div class="menu glass strong" id="plusmenu" role="menu" aria-label="Add" hidden>
        <button class="mi" id="m-files" type="button" role="menuitem">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l8.6-8.6a3.7 3.7 0 0 1 5.2 5.2l-8.6 8.6a1.8 1.8 0 0 1-2.6-2.6l7.9-7.9"/></svg>
          <span>Add files or photos</span></button>
        <button class="mi" id="m-shot" type="button" role="menuitem">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12.5" rx="2"/><path d="M8 20.5h8M12 17v3.5"/></svg>
          <span>Take a screenshot</span></button>
        <div class="sep" role="separator"></div>
        <button class="mi" id="m-think" type="button" role="menuitemcheckbox" aria-checked="false">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.2h5c0-.9.4-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
          <span>Extended thinking</span><i class="switch" aria-hidden="true"></i></button>
      </div>
      <input class="sr" id="upload" type="file" multiple tabindex="-1" aria-hidden="true">
    </div>
    <button class="icon-btn" id="menu" type="button" aria-label="Conversation, details and history" title="Conversation, details and history"
            aria-expanded="false" aria-controls="sheet">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M14.5 4.5v15"/></svg>
    </button>
  </div>
</footer>

<aside class="sheet glass strong" id="sheet" hidden aria-label="Conversation, details and history">
  <header>
    <div class="seg" role="tablist" aria-label="Sections">
      <button type="button" role="tab" data-tab="conv" aria-selected="true">Chat</button>
      <button type="button" role="tab" data-tab="detail" aria-selected="false">Details</button>
      <button type="button" role="tab" data-tab="activity" aria-selected="false">Activity</button>
      <button type="button" role="tab" data-tab="chats" aria-selected="false">History</button>
      <button type="button" role="tab" data-tab="neural" aria-selected="false">Neural</button>
    </div>
    <button class="icon-btn" id="close" type="button" aria-label="Close panel">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <section class="panel" data-panel="conv" role="tabpanel"><div id="transcript"></div></section>
  <section class="panel" data-panel="detail" role="tabpanel" hidden><div id="detail"></div></section>
  <section class="panel" data-panel="activity" role="tabpanel" hidden><h2>What Jarvis did</h2><ol id="actlist"></ol></section>
  <section class="panel" data-panel="chats" role="tabpanel" hidden>
    <div class="panel-head"><h2>Past chats</h2>
      <button class="btn primary" id="newchat" type="button">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5H7a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/><path d="M17.5 3.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4 8.5-8.5z"/></svg>New chat</button></div>
    <ul id="chatlist"></ul></section>
  <section class="panel" data-panel="neural" role="tabpanel" hidden>
    <div class="net">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <line class="ln" data-k="memory" x1="50" y1="40" x2="50" y2="18"/>
        <line class="ln" data-k="research" x1="57.07" y1="42.93" x2="72.63" y2="27.37"/>
        <line class="ln" data-k="system" x1="60" y1="50" x2="82" y2="50"/>
        <line class="ln" data-k="hardware" x1="57.07" y1="57.07" x2="72.63" y2="72.63"/>
        <line class="ln" data-k="voice" x1="50" y1="60" x2="50" y2="82"/>
        <line class="ln" data-k="study" x1="42.93" y1="57.07" x2="27.37" y2="72.63"/>
        <line class="ln" data-k="comms" x1="40" y1="50" x2="18" y2="50"/>
        <line class="ln" data-k="planner" x1="42.93" y1="42.93" x2="27.37" y2="27.37"/>
      </svg>
      <div class="nd core" data-k="core">Core</div>
      <div class="nd" data-k="memory" style="left:44%;top:6%"><span class="lb up">Memory</span></div>
      <div class="nd" data-k="research" style="left:70.87%;top:17.13%"><span class="lb up">Research</span></div>
      <div class="nd" data-k="system" style="left:82%;top:44%"><span class="lb dn">System</span></div>
      <div class="nd" data-k="hardware" style="left:70.87%;top:70.87%"><span class="lb dn">Hardware</span></div>
      <div class="nd" data-k="voice" style="left:44%;top:82%"><span class="lb dn">Voice</span></div>
      <div class="nd" data-k="study" style="left:17.13%;top:70.87%"><span class="lb dn">Study</span></div>
      <div class="nd" data-k="comms" style="left:6%;top:44%"><span class="lb dn">Comms</span></div>
      <div class="nd" data-k="planner" style="left:17.13%;top:17.13%"><span class="lb up">Planner</span></div>
    </div>
    <p id="netcap">Waiting for a command</p>
  </section>
</aside>

<div id="scrim" hidden></div>
